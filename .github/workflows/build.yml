name: Build MessengerVamos

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify modern Xposed metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep 'META-INF/xposed/scope.list'
          unzip -l "$APK" | grep 'META-INF/xposed/module.prop'
          unzip -p "$APK" META-INF/xposed/java_init.list | grep 'io.github.binxgtl.messengervamos.ModuleEntry'
          unzip -p "$APK" META-INF/xposed/scope.list | grep 'com.facebook.orca'
          sha256sum "$APK" | tee app-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MessengerVamos-M4-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
